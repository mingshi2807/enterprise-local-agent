[workspace]
members = [
    "apps/agent-service-daemon",
    "apps/agent-operator",
    "apps/agent-cli",
    "crates/agent-containment-linux",
    "crates/agent-deployment",
    "crates/agent-action-seal-local",
    "crates/agent-core",
    "crates/agent-harness",
    "crates/agent-graph",
    "crates/agent-knowledge",
    "crates/agent-knowledge-adapters",
    "crates/agent-loop",
    "crates/agent-mcp-adapters",
    "crates/agent-mvp",
    "crates/agent-persistence-sqlite",
    "crates/agent-provider-rig",
    "crates/agent-service",
    "crates/agent-service-http",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
agent-action-seal-local = { path = "crates/agent-action-seal-local" }
agent-containment-linux = { path = "crates/agent-containment-linux" }
agent-deployment = { path = "crates/agent-deployment" }
agent-harness = { path = "crates/agent-harness" }
agent-graph = { path = "crates/agent-graph" }
agent-knowledge = { path = "crates/agent-knowledge" }
agent-knowledge-adapters = { path = "crates/agent-knowledge-adapters" }
agent-loop = { path = "crates/agent-loop" }
agent-mcp-adapters = { path = "crates/agent-mcp-adapters" }
agent-mvp = { path = "crates/agent-mvp" }
agent-persistence-sqlite = { path = "crates/agent-persistence-sqlite" }
agent-provider-rig = { path = "crates/agent-provider-rig" }
agent-service = { path = "crates/agent-service" }
agent-service-http = { path = "crates/agent-service-http" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
anyhow = "1.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jsonschema = { version = "=0.49.2", default-features = false }
reqwest = { version = "=0.13.4", default-features = false }
landlock = { version = "=0.4.7", default-features = false }
libc = "0.2"
rig-core = { version = "=0.41.0", default-features = false, features = ["rustls"] }
rustix = { version = "=1.1.4", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.0", default-features = false, features = ["rt", "macros", "time", "sync", "net", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
